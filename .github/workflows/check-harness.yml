name: Check Harness Plugin

on:
  pull_request:
    paths: ['harness/**', 'src/**', 'characters/**/config.json', 'package.json', 'docs/harness.md', '.github/workflows/check-harness.yml']
  push:
    branches: [main]
    paths: ['harness/**', 'src/**', 'characters/**/config.json', 'package.json', 'docs/harness.md', '.github/workflows/check-harness.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: '3.12'
      - name: Install minimal Python dependencies
        run: python -m pip install -r harness/requirements.txt
      - name: Test adapter and real Python core with mock model
        run: npm test
        env:
          UMA_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
      - name: Check package contents
        run: npm run check:package
      - name: Pack installable bundle
        run: |
          mkdir -p dist
          npm pack --ignore-scripts --pack-destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-umamusume-agent
          path: dist/*.tgz
